<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ERD Pro - Final Architecture</title>
    <style>
        :root {
            --primary: #1e293b; --accent: #6366f1; --entity: #f97316; 
            --attr: #0ea5e9; --rel: #10b981; --bg: #0f172a; --panel: #1e293b;
        }
        body { font-family: 'Inter', system-ui, sans-serif; margin: 0; overflow: hidden; background: var(--bg); color: #f1f5f9; }
        
        #toolbar { 
            height: 65px; background: var(--panel); border-bottom: 1px solid #334155;
            display: flex; align-items: center; justify-content: space-between; padding: 0 24px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3); z-index: 1000; position: relative;
        }
        .btn-group { display: flex; gap: 10px; }
        .btn { 
            padding: 8px 14px; border: 1px solid #334155; border-radius: 6px; 
            background: #334155; cursor: pointer; font-size: 13px; font-weight: 600; color: white;
            transition: all 0.2s; display: flex; align-items: center; gap: 6px;
        }
        .btn:hover { background: #475569; border-color: var(--accent); }
        .btn-accent { background: var(--accent); border: none; }
        .btn-danger { background: #be123c; border: none; }

        #canvas-container { 
            width: 100vw; height: calc(100vh - 65px); position: relative; 
            overflow: auto; background-image: radial-gradient(#334155 1px, transparent 1px); background-size: 30px 30px;
        }
        #canvas { width: 4000px; height: 4000px; position: absolute; top: 0; left: 0; }

        .shape { 
            position: absolute; cursor: grab; display: flex; align-items: center; 
            justify-content: center; text-align: center; color: white; 
            font-weight: 600; box-sizing: border-box; min-width: 90px; min-height: 45px; 
            z-index: 10; box-shadow: 0 10px 15px rgba(0,0,0,0.3); border: 2px solid transparent;
            user-select: none;
        }
        .shape.selected { border-color: var(--accent); }
        .entity { background: var(--entity); border-radius: 4px; width: 140px; height: 70px; }
        .attribute { background: var(--attr); border-radius: 50px; width: 120px; height: 60px; }
        .relationship { background: var(--rel); clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%); width: 110px; height: 110px; }

        .text-node { outline: none; width: 80%; word-wrap: break-word; pointer-events: auto; font-size: 14px; cursor: text; user-select: text; }
        .pk-underline { text-decoration: underline; text-underline-offset: 4px; font-weight: 800; }
        
        .del-btn { 
            position: absolute; width: 22px; height: 22px; background: #ef4444; 
            color: white; border-radius: 50%; font-size: 14px; line-height: 20px; 
            text-align: center; cursor: pointer; display: none; z-index: 100; font-weight: bold;
            border: 2px solid var(--panel);
        }
        .shape:hover .del-btn { display: block; top: -11px; right: -11px; }
        .relationship:hover .del-btn { right: 15px; top: 15px; }

        .resizer { width: 14px; height: 14px; background: white; border: 2px solid var(--accent); position: absolute; right: -7px; bottom: -7px; cursor: nwse-resize; display: none; border-radius: 50%; z-index: 50; }
        .shape.selected .resizer { display: block; }
        .relationship .resizer { right: 18px; bottom: 18px; }

        .svg-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
        .connector { stroke: #94a3b8; stroke-width: 2.5; fill: none; pointer-events: stroke; cursor: pointer; }
        .anchor { width: 14px; height: 14px; background: white; border: 2px solid #334155; position: absolute; border-radius: 50%; pointer-events: auto; cursor: crosshair; z-index: 20; }
        
        .line-controls { position: absolute; display: flex; flex-direction: column; gap: 4px; align-items: center; z-index: 100; pointer-events: none; }
        .line-btn { 
            background: #ef4444; color: white; border-radius: 4px; font-size: 10px; 
            padding: 2px 6px; cursor: pointer; font-weight: bold; pointer-events: auto;
            border: none; opacity: 0; transition: opacity 0.2s;
        }
        .line-btn.show-card { background: var(--accent); }
        #canvas:hover .line-btn { opacity: 0.8; }
        .line-btn:hover { opacity: 1 !important; transform: scale(1.1); }

        .cardinality { 
            background: #1e293b; border: 1px solid #475569; font-size: 11px; padding: 2px 6px; 
            border-radius: 4px; position: absolute; color: white; font-weight: 800; 
            pointer-events: auto; z-index: 25; cursor: pointer;
        }
        .card-hidden { display: none !important; }

        #modal-overlay { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.8); backdrop-filter: blur(4px);
            z-index: 3000; display: none; align-items: center; justify-content: center; 
        }
        .modal-box { background: var(--panel); width: 550px; border-radius: 12px; padding: 30px; border: 1px solid #334155; }
    </style>
</head>
<body onload="checkURLData()">

<div id="toolbar">
    <div class="btn-group">
        <button class="btn" onclick="addShape('entity')">ישות</button>
        <button class="btn" onclick="addShape('attribute')">תכונה</button>
        <button class="btn" onclick="addShape('relationship')">קשר</button>
        <button class="btn btn-accent" onclick="addLine()">+ קו מחבר</button>
    </div>
    <div class="btn-group">
        <button class="btn" style="background:#8b5cf6" onclick="exportToSQL()">SQL ⚡</button>
        <button class="btn" onclick="saveToPortfolio()">שמור</button>
        <button class="btn" onclick="togglePortfolio()">העבודות שלי</button>
        <button class="btn btn-accent" onclick="generateShareLink()">🔗 קישור למרצה</button>
        <button class="btn btn-danger" onclick="clearBoard()">נקה הכל</button>
    </div>
</div>

<div id="canvas-container">
    <svg id="svg-layer" class="svg-layer"></svg>
    <div id="canvas"></div>
</div>

<div id="modal-overlay" onclick="if(event.target===this) this.style.display='none'">
    <div class="modal-box" id="modal-content"></div>
</div>

<script>
    let shapes = [], selected = null, db_key = 'erd_pro_v8';
    const canvas = document.getElementById('canvas'), svgLayer = document.getElementById('svg-layer');

    function addShape(type, data = null) {
        const el = document.createElement('div');
        el.className = `shape ${type}`;
        el.style.left = data?.left || '150px'; el.style.top = data?.top || '150px';
        if(data?.width) { el.style.width = data.width; el.style.height = data.height; }
        
        const txt = document.createElement('div');
        txt.className = 'text-node'; txt.contentEditable = true;
        txt.innerText = data?.text || (type === 'entity' ? 'ישות' : type === 'attribute' ? 'תכונה' : 'קשר');
        if(data?.pk) txt.classList.add('pk-underline');

        const del = document.createElement('div');
        del.className = 'del-btn'; del.innerText = '×';
        del.onclick = (e) => { e.stopPropagation(); el.remove(); shapes = shapes.filter(s => s !== el); };

        const res = document.createElement('div'); res.className = 'resizer';
        
        el.append(txt, del, res); canvas.appendChild(el); shapes.push(el);
        
        initDrag(el); initResize(el, res);
        el.onmousedown = () => { if(selected) selected.classList.remove('selected'); el.classList.add('selected'); selected = el; };
        el.ondblclick = () => { if(type === 'attribute') txt.classList.toggle('pk-underline'); };
    }

    function initDrag(el) {
        let sx, sy, il, it;
        el.addEventListener('mousedown', function(e) {
            if (e.target.className === 'resizer' || e.target.className === 'del-btn' || e.target.contentEditable === "true") return;
            e.preventDefault(); sx = e.clientX; sy = e.clientY; il = el.offsetLeft; it = el.offsetTop;
            const move = (de) => { el.style.left = il + (de.clientX - sx) + "px"; el.style.top = it + (de.clientY - sy) + "px"; };
            const up = () => { window.removeEventListener('mousemove', move); window.removeEventListener('mouseup', up); };
            window.addEventListener('mousemove', move); window.addEventListener('mouseup', up);
        });
    }

    function initResize(el, handle) {
        handle.addEventListener('mousedown', function(e) {
            e.preventDefault(); e.stopPropagation();
            let sw = el.offsetWidth, sh = el.offsetHeight, sx = e.clientX, sy = e.clientY;
            const move = (me) => {
                let nw = sw + (me.clientX - sx), nh = sh + (me.clientY - sy);
                if(el.classList.contains('relationship')) nw = nh = Math.max(nw, nh);
                el.style.width = Math.max(70, nw) + 'px'; el.style.height = Math.max(50, nh) + 'px';
            };
            const stop = () => { window.removeEventListener('mousemove', move); window.removeEventListener('mouseup', stop); };
            window.addEventListener('mousemove', move); window.addEventListener('mouseup', stop);
        });
    }

    function addLine(data = null) {
        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute("class", "connector"); svgLayer.appendChild(path);
        
        const a1 = createAnchor(data?.x1 || '120px', data?.y1 || '120px');
        const a2 = createAnchor(data?.x2 || '280px', data?.y2 || '120px');
        
        const card = document.createElement('div'); 
        card.className = 'cardinality' + (data?.cardHidden ? ' card-hidden' : ''); 
        card.contentEditable = true; card.innerText = data?.card || '1:N';
        
        const controls = document.createElement('div');
        controls.className = 'line-controls';
        
        const delBtn = document.createElement('button');
        delBtn.className = 'line-btn'; delBtn.innerText = 'מחק קו';
        delBtn.onclick = () => { path.remove(); a1.remove(); a2.remove(); card.remove(); controls.remove(); };

        const toggleBtn = document.createElement('button');
        toggleBtn.className = 'line-btn show-card'; toggleBtn.innerText = '+/- קרד';
        toggleBtn.onclick = () => { card.classList.toggle('card-hidden'); };

        controls.append(delBtn, toggleBtn);
        canvas.append(a1, a2, card, controls);
        
        const update = () => {
            const x1 = parseInt(a1.style.left)+7, y1 = parseInt(a1.style.top)+7, x2 = parseInt(a2.style.left)+7, y2 = parseInt(a2.style.top)+7;
            path.setAttribute("d", `M ${x1} ${y1} L ${x2} ${y2}`);
            const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
            card.style.left = (mx - 15) + 'px'; card.style.top = (my - 25) + 'px';
            controls.style.left = (mx - 25) + 'px'; controls.style.top = (my + 5) + 'px';
        };

        [a1, a2].forEach(a => {
            a.addEventListener('mousedown', function(e) {
                e.stopPropagation();
                const move = (de) => { 
                    const r = canvas.getBoundingClientRect();
                    a.style.left = (de.clientX - r.left + document.getElementById('canvas-container').scrollLeft) + 'px';
                    a.style.top = (de.clientY - r.top + document.getElementById('canvas-container').scrollTop) + 'px';
                    update();
                };
                const stop = () => { window.removeEventListener('mousemove', move); window.removeEventListener('mouseup', stop); };
                window.addEventListener('mousemove', move); window.addEventListener('mouseup', stop);
            });
        });

        card.addEventListener('dblclick', (e) => { card.classList.add('card-hidden'); e.stopPropagation(); });
        update();
    }

    function createAnchor(x, y) { const a = document.createElement('div'); a.className = 'anchor'; a.style.left = x; a.style.top = y; return a; }

    function exportToSQL() {
        let sql = "-- SQL Export\n";
        shapes.filter(s => s.classList.contains('entity')).forEach(ent => {
            sql += `CREATE TABLE ${ent.innerText.toUpperCase().replace(/\s+/g, '_')} (\n  id INT PRIMARY KEY\n);\n`;
        });
        showModal(`<h3>SQL Export</h3><pre style="background:#0f172a; padding:15px; border-radius:8px; color:#10b981; direction:ltr; overflow-x:auto;">${sql}</pre>`);
    }

    function getDiagramData() {
        const lines = [], anchors = document.querySelectorAll('.anchor'), cards = document.querySelectorAll('.cardinality');
        for(let i=0; i<anchors.length; i+=2) lines.push({ x1: anchors[i].style.left, y1: anchors[i].style.top, x2: anchors[i+1].style.left, y2: anchors[i+1].style.top, card: cards[i/2].innerText, cardHidden: cards[i/2].classList.contains('card-hidden') });
        return { shapes: shapes.map(s => ({ type: s.classList[1], left: s.style.left, top: s.style.top, width: s.style.width, height: s.style.height, text: s.querySelector('.text-node').innerText, pk: s.querySelector('.text-node').classList.contains('pk-underline') })), lines };
    }

    function saveToPortfolio() {
        const n = prompt("שם הפרויקט:"); if(!n) return;
        const db = JSON.parse(localStorage.getItem(db_key) || '{}');
        db[n] = getDiagramData(); localStorage.setItem(db_key, JSON.stringify(db)); alert("נשמר.");
    }

    function togglePortfolio() {
        const db = JSON.parse(localStorage.getItem(db_key) || '{}');
        let h = `<h3>העבודות שלי</h3><div style="max-height:300px; overflow:auto;">`;
        Object.keys(db).forEach(n => {
            h += `<div style="display:flex; justify-content:space-between; padding:10px; border-bottom:1px solid #334155;">
                <span>${n}</span>
                <div style="display:flex; gap:5px;">
                    <button class="btn" onclick="loadItem('${n}')">טען</button>
                    <button class="btn btn-danger" onclick="deleteItem('${n}')">מחק</button>
                </div></div>`;
        });
        h += `</div><button class="btn" onclick="document.getElementById('modal-overlay').style.display='none'" style="margin-top:10px; width:100%;">סגור</button>`;
        showModal(h);
    }

    function loadItem(n) { renderData(JSON.parse(localStorage.getItem(db_key))[n]); document.getElementById('modal-overlay').style.display='none'; }
    function deleteItem(n) { if(!confirm(`למחוק את ${n}?`)) return; const db = JSON.parse(localStorage.getItem(db_key)); delete db[n]; localStorage.setItem(db_key, JSON.stringify(db)); togglePortfolio(); }

    function showModal(c) { document.getElementById('modal-content').innerHTML = c; document.getElementById('modal-overlay').style.display = 'flex'; }
    function renderData(d) { canvas.innerHTML = ''; svgLayer.innerHTML = ''; shapes = []; d.shapes.forEach(s => addShape(s.type, s)); d.lines.forEach(l => addLine(l)); }
    function generateShareLink() { const enc = btoa(unescape(encodeURIComponent(JSON.stringify(getDiagramData())))); navigator.clipboard.writeText(window.location.href.split('?')[0] + "?data=" + enc).then(() => alert("קישור הועתק!")); }
    function checkURLData() { const p = new URLSearchParams(window.location.search).get('data'); if(p) renderData(JSON.parse(decodeURIComponent(escape(atob(p))))); }
    function clearBoard() { if(confirm("לנקות הכל?")) { canvas.innerHTML = ''; svgLayer.innerHTML = ''; shapes = []; } }
</script>
</body>
</html>
